<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TradingView Clone · Live Viewer</title>
<!--
  Phase 1 Live Viewer
  - Served by the backend at http://127.0.0.1:8000/viewer -> LIVE mode (real REST + WebSocket data, MT5 or simulator)
  - Opened anywhere else (e.g. inside Claude, or double-clicked)   -> DEMO mode (prices simulated in the browser)
  The lightweight-charts library is loaded from a CDN (unpkg, with jsDelivr as fallback).
-->
<style>
  :root {
    --bg: #131722; --panel: #1e222d; --border: #2a2e39; --text: #d1d4dc; --muted: #787b86;
    --accent: #2962ff; --up: #26a69a; --down: #ef5350; --warn: #f0b90b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif; font-size: 13px; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  .toolbar { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 10px;
    background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .brand { font-weight: 700; letter-spacing: .3px; margin-right: 6px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
  select, input { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; height: 30px; padding: 0 8px; font: inherit; outline: none; }
  select:focus, input:focus { border-color: var(--accent); }
  #symbol { width: 130px; font-weight: 600; text-transform: uppercase; }
  .tfs { display: flex; gap: 2px; }
  .tf { background: transparent; color: var(--text); border: 0; border-radius: 4px; height: 30px;
    min-width: 34px; padding: 0 8px; cursor: pointer; font: inherit; }
  .tf:hover { background: var(--panel); }
  .tf.active { color: #fff; background: var(--accent); }
  .spacer { flex: 1; }
  .quote { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .quote .px { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; transition: color .15s; }
  .quote .ba { color: var(--muted); font-variant-numeric: tabular-nums; }
  .quote .ba b { color: var(--text); font-weight: 500; }
  .up { color: var(--up) !important; } .down { color: var(--down) !important; }
  .badge { padding: 4px 9px; border-radius: 12px; font-size: 11px; font-weight: 700; letter-spacing: .4px;
    white-space: nowrap; cursor: help; }
  .badge.live { background: rgba(38,166,154,.15); color: var(--up); border: 1px solid rgba(38,166,154,.4); }
  .badge.demo { background: rgba(240,185,11,.12); color: var(--warn); border: 1px solid rgba(240,185,11,.4); }
  .badge.wait { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }

  .chart-wrap { position: relative; flex: 1; min-height: 0; }
  #chart { position: absolute; inset: 0; }
  .legend { position: absolute; top: 8px; left: 12px; z-index: 3; pointer-events: none;
    font-variant-numeric: tabular-nums; line-height: 1.6; }
  .legend .title { font-size: 15px; font-weight: 600; }
  .legend .title small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .legend .ohlc span { margin-right: 10px; } .legend .ohlc i { color: var(--muted); font-style: normal; margin-right: 3px; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); z-index: 4; background: rgba(19,23,34,.6); font-size: 14px; }
  .hidden { display: none !important; }

  .statusbar { display: flex; gap: 18px; align-items: center; height: 26px; padding: 0 10px; flex-shrink: 0;
    border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.ok { background: var(--up); } .dot.bad { background: var(--down); } .dot.warn { background: var(--warn); }
  .statusbar .right { margin-left: auto; }

  .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10; max-width: 80%;
    background: #2a1a1d; border: 1px solid var(--down); color: #ffb4b2; padding: 9px 14px; border-radius: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .toast.info { background: #1a2333; border-color: var(--accent); color: #c5d4ff; }

  @media (max-width: 820px) { .quote .ba, .brand { display: none; } #symbol { width: 100px; } }
</style>

<!-- Chart library (TradingView lightweight-charts v4.2.3, Apache-2.0). Needs internet the first time; the browser caches it. -->
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts || document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"><\/script>');</script>
<script>
"use strict";
// =====================================================================
// Shared helpers
// =====================================================================
const TIMEFRAMES = [
  { v: "M1", l: "1m", s: 60 }, { v: "M5", l: "5m", s: 300 }, { v: "M15", l: "15m", s: 900 },
  { v: "M30", l: "30m", s: 1800 }, { v: "H1", l: "1h", s: 3600 }, { v: "H4", l: "4h", s: 14400 },
  { v: "D1", l: "1D", s: 86400 }, { v: "W1", l: "1W", s: 604800 }, { v: "MN1", l: "1M", s: 2592000 },
];
const TF_SECONDS = Object.fromEntries(TIMEFRAMES.map(t => [t.v, t.s]));
const $ = id => document.getElementById(id);

function bucketStart(ts, tf) {
  if (tf === "W1" || tf === "MN1") {
    const d = new Date(ts * 1000);
    if (tf === "W1") return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - d.getUTCDay()) / 1000;
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000;
  }
  const p = TF_SECONDS[tf];
  return ts - (ts % p);
}

class CandleAggregator {
  constructor(tf, seed) { this.tf = tf; this.cur = seed ? { ...seed } : null; }
  update(price, timeMs) {
    if (!(price > 0)) return null;
    const t = bucketStart(Math.floor(timeMs / 1000), this.tf);
    const c = this.cur;
    if (!c || t > c.time) this.cur = { time: t, open: price, high: price, low: price, close: price, volume: 1 };
    else if (t === c.time) { c.high = Math.max(c.high, price); c.low = Math.min(c.low, price); c.close = price; c.volume += 1; }
    else return null;
    return { ...this.cur };
  }
}

let toastTimer = null;
function toast(msg, kind = "error") {
  const el = $("toast");
  el.textContent = msg;
  el.className = "toast" + (kind === "info" ? " info" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), 5000);
}

async function fetchJson(url, timeoutMs = 8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal, headers: { Accept: "application/json" } });
    const ct = res.headers.get("content-type") || "";
    const body = ct.includes("application/json") ? await res.json() : null;
    if (!res.ok) throw new Error((body && (body.error || JSON.stringify(body.detail))) || `HTTP ${res.status}`);
    if (body === null) throw new Error("Unexpected non-JSON response");
    return body;
  } finally { clearTimeout(timer); }
}

// =====================================================================
// LIVE source — talks to the FastAPI backend (same origin)
// =====================================================================
class LiveSource {
  constructor() {
    this.mode = "live";
    this.ws = null; this.wanted = new Map(); this.retry = 0; this.closedByUs = false;
    this.onTick = () => {}; this.onCandle = () => {}; this.onStatus = () => {};
    this.onConn = () => {}; this.onReconnect = () => {}; this.onError = () => {};
  }
  async init() {
    if (!/^https?:$/.test(location.protocol)) throw new Error("not served over http");
    const h = await fetchJson("/api/health", 1500);
    if (h.status !== "ok") throw new Error("backend not healthy");
    this._connect(false);
  }
  providers() { return fetchJson("/api/providers"); }
  symbols(provider, query) {
    const q = new URLSearchParams({ provider, limit: "1000" });
    if (query) q.set("query", query);
    return fetchJson("/api/symbols?" + q);
  }
  async history(provider, symbol, tf, count, to) {
    const q = new URLSearchParams({ provider, symbol, timeframe: tf, count: String(count) });
    if (to) q.set("to", String(to));
    return (await fetchJson("/api/history?" + q, 20000)).candles;
  }
  subscribe(provider, symbol, tf) {
    const msg = { action: "subscribe", provider, symbol, timeframe: tf };
    this.wanted.set(`${provider}|${symbol}|${tf}`, msg);
    this._send(msg);
  }
  unsubscribe(provider, symbol, tf) {
    this.wanted.delete(`${provider}|${symbol}|${tf}`);
    this._send({ action: "unsubscribe", provider, symbol, timeframe: tf });
  }
  _send(msg) { if (this.ws && this.ws.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(msg)); }
  _connect(isReconnect) {
    const url = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/market`;
    this.onConn("connecting", isReconnect ? "Reconnecting…" : "Connecting…");
    let ws;
    try { ws = new WebSocket(url); } catch (e) { this._scheduleReconnect(); return; }
    this.ws = ws;
    ws.onopen = () => {
      this.retry = 0;
      this.onConn("ok", "WebSocket connected");
      for (const msg of this.wanted.values()) ws.send(JSON.stringify(msg));
      if (isReconnect) this.onReconnect();
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      switch (m.type) {
        case "tick": this.onTick(m.data); break;
        case "candle": this.onCandle(m.provider, m.symbol, m.timeframe, m.data); break;
        case "status": this.onStatus(m.data); break;
        case "welcome": (m.providers || []).forEach(p => this.onStatus(p)); break;
        case "error": this.onError(m.message); break;
      }
    };
    ws.onclose = () => { if (!this.closedByUs) this._scheduleReconnect(); };
    ws.onerror = () => {};
  }
  _scheduleReconnect() {
    const delay = Math.min(1000 * 2 ** this.retry, 15000);
    this.retry++;
    this.onConn("bad", `Disconnected — retrying in ${Math.round(delay / 1000)}s`);
    setTimeout(() => this._connect(true), delay);
  }
}

// =====================================================================
// DEMO source — same interface, prices simulated in the browser
// (a JavaScript port of backend/app/providers/simulated_provider.py)
// =====================================================================
const DEMO_SYMBOLS = [
  { symbol: "EURUSD", description: "Euro vs US Dollar", start: 1.0850, digits: 5, spread: 0.00008, vol: 0.00004 },
  { symbol: "GBPUSD", description: "British Pound vs US Dollar", start: 1.2700, digits: 5, spread: 0.00010, vol: 0.00005 },
  { symbol: "USDJPY", description: "US Dollar vs Japanese Yen", start: 151.20, digits: 3, spread: 0.010, vol: 0.00005 },
  { symbol: "XAUUSD", description: "Gold vs US Dollar", start: 2350.00, digits: 2, spread: 0.25, vol: 0.00008 },
  { symbol: "BTCUSD", description: "Bitcoin vs US Dollar", start: 65000.0, digits: 2, spread: 15.0, vol: 0.00015 },
  { symbol: "NIFTY50", description: "NIFTY 50 Index (simulated)", start: 24500.0, digits: 2, spread: 0, vol: 0.00006 },
  { symbol: "RELIANCE", description: "Reliance Industries (simulated)", start: 2950.0, digits: 2, spread: 0, vol: 0.00009 },
];

function seededRng(seedText) {
  let h = 1779033703 ^ seedText.length;
  for (let i = 0; i < seedText.length; i++) { h = Math.imul(h ^ seedText.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function gauss(rng, sd) {
  const u = Math.max(rng(), 1e-12), v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v) * sd;
}
const round = (x, d) => Math.round(x * 10 ** d) / 10 ** d;

class DemoSource {
  constructor(intervalMs = 250) {
    this.mode = "demo"; this.intervalMs = intervalMs;
    this.specs = new Map(DEMO_SYMBOLS.map(s => [s.symbol, s]));
    this.prices = new Map(DEMO_SYMBOLS.map(s => [s.symbol, s.start]));
    this.subs = new Map(); this.rng = Math.random; this.openCache = new Map();
    this.onTick = () => {}; this.onCandle = () => {}; this.onStatus = () => {};
    this.onConn = () => {}; this.onReconnect = () => {}; this.onError = () => {};
  }
  async init() {
    setInterval(() => this._tick(), this.intervalMs);
    this.onConn("warn", "Demo mode — no backend connected");
    this.onStatus({ name: "simulated", connected: true, message: "In-browser simulation" });
  }
  async providers() { return [{ name: "simulated", connected: true, message: "In-browser simulation" }]; }
  async symbols(_p, query) {
    const q = (query || "").toUpperCase();
    return DEMO_SYMBOLS.filter(s => !q || s.symbol.includes(q) || s.description.toUpperCase().includes(q))
      .map(s => ({ provider: "simulated", symbol: s.symbol, description: s.description, digits: s.digits }));
  }
  _spec(symbol) {
    const s = this.specs.get(String(symbol).toUpperCase());
    if (!s) throw new Error(`Symbol '${symbol}' not available in demo. Try: ${[...this.specs.keys()].join(", ")}`);
    return s;
  }
  _history(symbol, tf, count, to) {
    const spec = this._spec(symbol);
    const key = `${spec.symbol}|${tf}`;
    const cache = this.openCache.get(key) || new Map();
    this.openCache.set(key, cache);
    const now = Math.floor(Date.now() / 1000);
    const end = to ? bucketStart(to - 1, tf) : bucketStart(now, tf);
    // older pages continue from the oldest bar already on the chart (no gaps)
    const anchor = to ? (cache.get(bucketStart(to, tf)) ?? this.prices.get(spec.symbol)) : this.prices.get(spec.symbol);
    const times = []; let t = end;
    for (let i = 0; i < count; i++) { times.push(t); t = bucketStart(t - 1, tf); }
    const rng = seededRng(`${spec.symbol}:${tf}:${times[times.length - 1]}:${times[0]}`);
    const sv = spec.vol * Math.sqrt(TF_SECONDS[tf]), floor = spec.start * 0.05;
    let price = anchor; const out = [];
    for (const bt of times) { // newest -> oldest, walking backwards from the anchor
      const c = price, o = Math.max(c / (1 + gauss(rng, sv)), floor);
      const h = Math.max(o, c) * (1 + Math.abs(gauss(rng, sv * 0.6)));
      const l = Math.min(o, c) * (1 - Math.abs(gauss(rng, sv * 0.6)));
      const v = Math.floor(Math.abs(1 + gauss(rng, 0.5)) * TF_SECONDS[tf] / 2) + 1;
      out.push({ time: bt, open: o, high: h, low: l, close: c, volume: v }); price = o;
    }
    out.reverse();
    if (cache.size > 200000) cache.clear();
    out.forEach(cd => {
      for (const k of ["open", "high", "low", "close"]) cd[k] = round(cd[k], spec.digits);
      cache.set(cd.time, cd.open);
    });
    return out;
  }
  async history(_p, symbol, tf, count, to) { return this._history(symbol, tf, count, to); }
  subscribe(provider, symbol, tf) {
    const spec = this._spec(symbol);
    const seed = this._history(spec.symbol, tf, 1).pop();
    this.subs.set(`${provider}|${spec.symbol}|${tf}`, { symbol: spec.symbol, tf, agg: new CandleAggregator(tf, seed) });
  }
  unsubscribe(provider, symbol, tf) { this.subs.delete(`${provider}|${String(symbol).toUpperCase()}|${tf}`); }
  _tick() {
    const now = Date.now();
    const symbols = new Set([...this.subs.values()].map(s => s.symbol));
    for (const sym of symbols) {
      const spec = this.specs.get(sym);
      let p = this.prices.get(sym) * (1 + gauss(this.rng, spec.vol * Math.sqrt(this.intervalMs / 1000)));
      p = round(Math.max(p, spec.start * 0.05), spec.digits);
      this.prices.set(sym, p);
      const fx = spec.spread > 0;
      this.onTick({ provider: "simulated", symbol: sym, time_ms: now, bid: p, ask: fx ? round(p + spec.spread, spec.digits) : p,
        last: fx ? 0 : p, volume: 0, price: p });
      for (const s of this.subs.values()) {
        if (s.symbol !== sym) continue;
        const c = s.agg.update(p, now);
        if (c) this.onCandle("simulated", sym, s.tf, c);
      }
    }
  }
}

// =====================================================================
// Chart (lightweight-charts) — TradingView dark theme
// =====================================================================
const LWC = window.LightweightCharts;
if (!LWC) {
  document.getElementById("loading").textContent =
    "Chart library failed to load. This page needs internet access to unpkg.com or cdn.jsdelivr.net.";
  throw new Error("lightweight-charts not loaded");
}
const chart = LWC.createChart($("chart"), {
  autoSize: true,
  layout: { background: { type: "solid", color: "#131722" }, textColor: "#d1d4dc", fontSize: 12 },
  grid: { vertLines: { color: "#1e222d" }, horzLines: { color: "#1e222d" } },
  crosshair: { mode: LWC.CrosshairMode.Normal },
  rightPriceScale: { borderColor: "#2a2e39", scaleMargins: { top: 0.1, bottom: 0.25 } },
  timeScale: { borderColor: "#2a2e39", timeVisible: true, secondsVisible: false, rightOffset: 8 },
});
const candleSeries = chart.addCandlestickSeries({
  upColor: "#26a69a", downColor: "#ef5350", borderVisible: false, wickUpColor: "#26a69a", wickDownColor: "#ef5350",
});
const volumeSeries = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "", lastValueVisible: false, priceLineVisible: false });
volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
const volBar = c => ({ time: c.time, value: c.volume, color: c.close >= c.open ? "rgba(38,166,154,.45)" : "rgba(239,83,80,.45)" });

// =====================================================================
// App state + controller
// =====================================================================
const state = {
  source: null, provider: null, symbol: "EURUSD", tf: "M1", digits: 5,
  candles: [], symbolMeta: new Map(), providerStatus: new Map(),
  loadToken: 0, loadingOlder: false, noMoreHistory: false, lastPrice: null, tickCount: 0,
};
const fmt = x => (x == null || isNaN(x)) ? "—" : Number(x).toFixed(state.digits);

function renderLegend(c) {
  const desc = (state.symbolMeta.get(state.symbol) || {}).description || "";
  const tfLabel = (TIMEFRAMES.find(t => t.v === state.tf) || {}).l;
  $("lg-title").innerHTML = `${state.symbol} · ${tfLabel} · ${state.provider || ""}<small>${desc}</small>`;
  if (!c) { $("lg-ohlc").innerHTML = ""; return; }
  const chg = c.close - c.open, pct = c.open ? (chg / c.open) * 100 : 0, cls = chg >= 0 ? "up" : "down";
  $("lg-ohlc").innerHTML =
    `<span><i>O</i><b class="${cls}">${fmt(c.open)}</b></span><span><i>H</i><b class="${cls}">${fmt(c.high)}</b></span>` +
    `<span><i>L</i><b class="${cls}">${fmt(c.low)}</b></span><span><i>C</i><b class="${cls}">${fmt(c.close)}</b></span>` +
    `<span class="${cls}">${chg >= 0 ? "+" : ""}${fmt(chg)} (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%)</span>` +
    `<span><i>Vol</i>${Math.round(c.volume ?? 0).toLocaleString()}</span>`;
}
chart.subscribeCrosshairMove(param => {
  const d = param && param.time ? param.seriesData.get(candleSeries) : null;
  if (d) {
    const v = param.seriesData.get(volumeSeries);
    renderLegend({ ...d, volume: v ? v.value : 0 });
  } else renderLegend(state.candles[state.candles.length - 1]);
});

function renderProviders(list) {
  const sel = $("provider");
  sel.innerHTML = "";
  for (const p of list) {
    const o = document.createElement("option");
    o.value = p.name;
    o.textContent = p.name + (state.source.mode === "demo" ? " (demo)" : p.connected ? "" : " (offline)");
    sel.appendChild(o);
  }
  sel.value = state.provider;
}
function renderProviderStatus() {
  const parts = [...state.providerStatus.values()].map(p => {
    const via = p.details && p.details.active_source ? ` → ${p.details.active_source}` : "";
    return `${p.connected ? "🟢" : "🔴"} ${p.name}${via}`;
  });
  $("prov-text").textContent = parts.join("   ");
  $("prov-text").title = [...state.providerStatus.values()].map(p => `${p.name}: ${p.message}`).join("\n");
}

async function loadSymbols() {
  try {
    const list = await state.source.symbols(state.provider);
    state.symbolMeta = new Map(list.map(s => [s.symbol, s]));
    $("symbol-list").innerHTML = list.map(s => `<option value="${s.symbol}">${s.description || ""}</option>`).join("");
    if (!state.symbolMeta.has(state.symbol) && list.length) {
      const pref = list.find(s => s.symbol.toUpperCase().startsWith("EURUSD")) || list[0];
      state.symbol = pref.symbol;
    }
  } catch (e) { toast(`Could not load symbols: ${e.message}`); }
  $("symbol").value = state.symbol;
}

function applyDigits() {
  const meta = state.symbolMeta.get(state.symbol);
  state.digits = meta && Number.isInteger(meta.digits) ? meta.digits : 5;
  candleSeries.applyOptions({ priceFormat: { type: "price", precision: state.digits, minMove: 1 / 10 ** state.digits } });
}

let current = null; // {provider, symbol, tf} currently subscribed
async function loadChart() {
  const token = ++state.loadToken;
  $("loading").classList.remove("hidden");
  if (current) { try { state.source.unsubscribe(current.provider, current.symbol, current.tf); } catch {} current = null; }
  applyDigits();
  state.noMoreHistory = false; state.lastPrice = null;
  ["q-price", "q-bid", "q-ask", "q-spread"].forEach(id => { $(id).textContent = "—"; $(id).className = id === "q-price" ? "px" : ""; });
  try {
    const candles = await state.source.history(state.provider, state.symbol, state.tf, 500);
    if (token !== state.loadToken) return;
    state.candles = candles;
    candleSeries.setData(candles);
    volumeSeries.setData(candles.map(volBar));
    chart.timeScale().scrollToRealTime();
    renderLegend(candles[candles.length - 1]);
    state.source.subscribe(state.provider, state.symbol, state.tf);
    current = { provider: state.provider, symbol: state.symbol, tf: state.tf };
    document.title = `${state.symbol} ${fmt(candles.length ? candles[candles.length - 1].close : NaN)} · TV Clone`;
  } catch (e) {
    if (token !== state.loadToken) return;
    state.candles = []; candleSeries.setData([]); volumeSeries.setData([]); renderLegend(null);
    toast(e.message);
  } finally {
    if (token === state.loadToken) $("loading").classList.add("hidden");
  }
}

async function loadOlder() {
  if (state.loadingOlder || state.noMoreHistory || !state.candles.length) return;
  state.loadingOlder = true;
  const token = state.loadToken, oldest = state.candles[0].time;
  try {
    const older = (await state.source.history(state.provider, state.symbol, state.tf, 500, oldest)).filter(c => c.time < oldest);
    if (token !== state.loadToken) return;
    if (!older.length) { state.noMoreHistory = true; return; }
    const ts = chart.timeScale(), range = ts.getVisibleLogicalRange();
    state.candles = older.concat(state.candles);
    candleSeries.setData(state.candles);
    volumeSeries.setData(state.candles.map(volBar));
    if (range) ts.setVisibleLogicalRange({ from: range.from + older.length, to: range.to + older.length });
  } catch (e) { toast(`Could not load older history: ${e.message}`); }
  finally { state.loadingOlder = false; }
}
chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r && r.from < 15) loadOlder(); });

function handleTick(t) {
  if (!current || t.provider !== current.provider || t.symbol !== current.symbol) return;
  state.tickCount++;
  const pxEl = $("q-price");
  if (state.lastPrice != null && t.price !== state.lastPrice) pxEl.className = "px " + (t.price > state.lastPrice ? "up" : "down");
  state.lastPrice = t.price;
  pxEl.textContent = fmt(t.price);
  $("q-bid").textContent = t.bid ? fmt(t.bid) : "—";
  $("q-ask").textContent = t.ask ? fmt(t.ask) : "—";
  $("q-spread").textContent = t.bid && t.ask ? Math.round((t.ask - t.bid) * 10 ** state.digits).toString() : "—";
  document.title = `${t.symbol} ${fmt(t.price)} · TV Clone`;
}
function handleCandle(provider, symbol, tf, c) {
  if (!current || provider !== current.provider || symbol !== current.symbol || tf !== current.tf) return;
  const last = state.candles[state.candles.length - 1];
  if (last && c.time < last.time) return;
  if (last && c.time === last.time) state.candles[state.candles.length - 1] = c; else state.candles.push(c);
  candleSeries.update(c);
  volumeSeries.update(volBar(c));
  renderLegend(c);
}

function setConn(kind, text) {
  $("conn-dot").className = "dot " + (kind === "ok" ? "ok" : kind === "bad" ? "bad" : kind === "warn" ? "warn" : "");
  $("conn-text").textContent = text;
}

function buildTimeframeButtons() {
  $("tfs").innerHTML = "";
  for (const tf of TIMEFRAMES) {
    const b = document.createElement("button");
    b.className = "tf" + (tf.v === state.tf ? " active" : "");
    b.textContent = tf.l; b.title = tf.v;
    b.onclick = () => {
      if (state.tf === tf.v) return;
      state.tf = tf.v;
      document.querySelectorAll(".tf").forEach(x => x.classList.toggle("active", x.title === tf.v));
      loadChart();
    };
    $("tfs").appendChild(b);
  }
}

function wireControls() {
  $("provider").onchange = async e => {
    state.provider = e.target.value;
    await loadSymbols();
    loadChart();
  };
  const commitSymbol = () => {
    const raw = $("symbol").value.trim();
    if (!raw) { $("symbol").value = state.symbol; return; }
    // match case-insensitively against known names (MT5 names are case-sensitive)
    const match = [...state.symbolMeta.keys()].find(s => s.toUpperCase() === raw.toUpperCase());
    const next = match || raw;
    if (next === state.symbol) return;
    state.symbol = next; $("symbol").value = next;
    loadChart();
  };
  $("symbol").addEventListener("change", commitSymbol);
  $("symbol").addEventListener("keydown", e => { if (e.key === "Enter") { commitSymbol(); e.target.blur(); } });
  $("symbol").addEventListener("focus", e => e.target.select());
}

function setModeBadge(mode) {
  const el = $("mode");
  if (mode === "live") {
    el.className = "badge live"; el.textContent = "● LIVE · BACKEND";
    el.title = "Connected to your FastAPI backend: REST /api/history + WebSocket /ws/market";
  } else {
    el.className = "badge demo"; el.textContent = "DEMO · BROWSER SIM";
    el.title = "No backend reachable, so prices are simulated in your browser.\n" +
      "Start the backend (python run.py) and open http://127.0.0.1:8000/viewer for live data.";
  }
}

setInterval(() => {
  $("clock").textContent = new Date().toISOString().slice(11, 19) + " UTC";
  $("rate-text").textContent = `${state.tickCount} ticks/s`;
  state.tickCount = 0;
}, 1000);

// =====================================================================
// Boot: try LIVE, fall back to DEMO
// =====================================================================
(async function boot() {
  buildTimeframeButtons();
  wireControls();
  const attach = src => {
    state.source = src;
    src.onTick = handleTick;
    src.onCandle = handleCandle;
    src.onConn = setConn;
    src.onError = msg => toast(msg);
    src.onReconnect = () => { toast("Reconnected to backend", "info"); loadChart(); };
    src.onStatus = p => {
      const prev = state.providerStatus.get(p.name);
      const prevSrc = prev && prev.details ? prev.details.active_source : undefined;
      const newSrc = p.details ? p.details.active_source : undefined;
      if (prev && prev.connected && !p.connected) toast(`${p.name} disconnected: ${p.message}`);
      if (prev && newSrc && prevSrc && newSrc !== prevSrc) {
        // "auto" provider failed over (e.g. MT5 -> OANDA) or switched back: reload from the new source
        toast(`Data source switched: ${prevSrc} → ${newSrc}`, "info");
        if (p.name === state.provider) loadChart();
      } else if (prev && !prev.connected && p.connected) {
        toast(`${p.name} connected`, "info");
        if (p.name === state.provider) loadChart();
      }
      state.providerStatus.set(p.name, p);
      if (state.provider) { renderProviderStatus(); renderProviders([...state.providerStatus.values()]); }
    };
    return src;
  };
  let source = attach(new LiveSource());
  try { await source.init(); }
  catch {
    source = attach(new DemoSource());
    await source.init();
  }
  setModeBadge(source.mode);

  let providers = [];
  try { providers = await source.providers(); } catch (e) { toast(`Could not load providers: ${e.message}`); }
  providers.forEach(p => state.providerStatus.set(p.name, p));
  const params = new URLSearchParams(location.search);
  const preferred = params.get("provider");
  const connected = providers.filter(p => p.connected);
  state.provider = (providers.find(p => p.name === preferred) || connected.find(p => p.name === "auto") ||
    connected.find(p => p.name === "mt5") || connected[0] || providers[0] || { name: "simulated" }).name;
  if (params.get("symbol")) state.symbol = params.get("symbol");
  if (params.get("tf") && TF_SECONDS[params.get("tf")]) { state.tf = params.get("tf"); buildTimeframeButtons(); }
  renderProviders(providers);
  renderProviderStatus();
  await loadSymbols();
  await loadChart();
})();
</script>
</body>
</html>
